name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Do not include bot tokens, private keys, message content or real user data.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options: [Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer the offline fixture and a redacted launch profile.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true

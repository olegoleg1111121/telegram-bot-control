name: Draft release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, matching both package versions
        required: true
        default: v0.7.0

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev,release]'
      - run: python scripts/release_check.py --tag "$RELEASE_TAG"
      - run: python -m pytest -q
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --dir desktop --frozen-lockfile
      - run: pnpm --dir desktop run build
      - run: python -m build --outdir dist
      - run: python -m twine check dist/*
      - name: Archive the exact tagged source
        run: git archive --format=zip --prefix="telegram-bot-control-${RELEASE_TAG}/" -o "dist/telegram-bot-control-${RELEASE_TAG}-source.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-and-source
          path: dist/*

  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: ubuntu-24.04
            artifact: linux
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          run_install: false
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/release_check.py --tag "$env:RELEASE_TAG"
      - run: pnpm install --dir desktop --frozen-lockfile
      - run: pnpm --dir desktop run test
        env:
          BOTCONTROL_PYTHON: ${{ steps.python.outputs.python-path }}
      - run: pnpm --dir desktop run build
      - run: pnpm --dir desktop run dist
      - name: Package portable Windows application
        if: runner.os == 'Windows'
        run: |
          $desktopVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          Compress-Archive -LiteralPath desktop/release/win-unpacked -DestinationPath "desktop/release/Telegram-Bot-Control-$desktopVersion-windows-x64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.artifact }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*windows-x64.zip
          if-no-files-found: error

  draft:
    needs: [python, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - run: python scripts/write_checksums.py release
      - name: Create a draft for the owner to review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
              --title "Telegram Bot Control $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
